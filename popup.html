<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="popup-header">
      <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <h1>Meetings Widget</h1>
    </div>

    <div id="signed-out" class="section" style="display: none;">
      <p class="desc">Sign in to see your upcoming Google Calendar meetings on every page.</p>
      <button id="sign-in-btn" class="btn primary">Sign in with Google</button>
    </div>

    <div id="signed-in" class="section" style="display: none;">
      <div class="user-info">
        <span class="user-dot"></span>
        <span id="user-email" class="email"></span>
      </div>

      <div id="next-meeting" class="next-meeting" style="display: none;">
        <div class="label">Next meeting</div>
        <div id="next-meeting-title" class="next-title"></div>
        <div id="next-meeting-time" class="next-time"></div>
      </div>

      <div id="no-meetings" class="no-meetings" style="display: none;">
        <p>No upcoming meetings in the next 24h.</p>
      </div>

      <div class="actions">
        <a href="https://calendar.google.com" target="_blank" class="btn secondary">Open Calendar</a>
        <button id="sign-out-btn" class="btn text">Sign out</button>
      </div>
    </div>

    <div id="loading" class="section">
      <div class="spinner"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
